name: Sync nades

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-nades
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install nades-helper
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Update annotations
        run: nades-helper update

      - name: Generate outputs
        run: nades-helper build

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nades out
          git diff --cached --quiet || git commit -m "chore(nades): sync annotations and outputs"
          git push
